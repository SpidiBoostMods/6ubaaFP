plugins { id 'fabric-loom' version '1.9.2' }
version = project.mod_version
group = 'net.spidiboost.sixubaafp'
base { archivesName = '6ubaaFP-1.21.4' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.4'
    mappings 'net.fabricmc:yarn:1.21.4+build.8:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.119.4+1.21.4'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
tasks.withType(JavaExec).configureEach { javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) } }
test { useJUnitPlatform(); javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) } }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
if (project.hasProperty('fpSmoke')) {
    loom.runs.client { runDir 'build/fp-smoke'; vmArg '-Dsixubaafp.smoke=true' }
    tasks.named('runClient', JavaExec) { if (System.getProperty('os.name').startsWith('Mac')) jvmArgs '-XstartOnFirstThread' }
}

apply from: 'shared-updater.gradle'

// Isolated real packet/UI fixture; excluded from production archives.
sourceSets { runtimeProbe {
    compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
} }
if (project.hasProperty('fpNative')) {
    loom.mods { sixubaafp { sourceSet sourceSets.main }; fp_probe { sourceSet sourceSets.runtimeProbe } }
    loom.runs { verification {
        client(); source sourceSets.runtimeProbe; runDir 'build/runtime-verification'
        programArgs '--username', 'FPQA', '--quickPlaySingleplayer', 'SpidiCard-QA'
        if (project.hasProperty('fpCrash')) vmArg '-Dsixubaafp.qa.crash=true'
        if (project.hasProperty('fpHistory')) vmArg '-Dsixubaafp.qa.history=true'
        if (System.getProperty('os.name').startsWith('Mac')) vmArg '-XstartOnFirstThread'
    } }
    tasks.named('runVerification', JavaExec) { doFirst {
        def options = file('build/runtime-verification/options.txt')
        options.parentFile.mkdirs(); options.text = 'onboardAccessibility:false\nlang:ru_ru\nrenderDistance:2\nsimulationDistance:5\nmaxFps:60\npauseOnLostFocus:false\nsoundCategory_master:0.0\n'
        file(project.hasProperty('fpHistory') ? 'build/runtime-verification/native-history-results.txt' : 'build/runtime-verification/native-results.txt').delete()
    }; doLast {
        def report = file(project.hasProperty('fpHistory') ? 'build/runtime-verification/native-history-results.txt' : 'build/runtime-verification/native-results.txt')
        if (!report.isFile() || !report.text.contains('PASS') || report.text.contains('FAIL')) throw new GradleException('Native verification failed: ' + report)
    } }
}
